services:
  mongodb:
    image: mongo:8.0
    container_name: litemongo-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: localpassword
      MONGO_INITDB_DATABASE: insurance_dev
    volumes:
      - litemongo_data:/data/db
      - ./mongo-seed.js:/docker-entrypoint-initdb.d/01-mongo-seed.js:ro
      - ./mongo-seed-rich.js:/docker-entrypoint-initdb.d/02-mongo-seed-rich.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  litemongo_data:
